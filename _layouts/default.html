<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.titulo | default: "Inicio" }} · Sistema de Gestión Docente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/icons.css' | relative_url }}">
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/favicon/favicon-32x32.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/img/favicon/favicon-16x16.png' | relative_url }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/img/favicon/apple-touch-icon.png' | relative_url }}">
    <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
    <script>
        window.API_URL = "{{ site.api_url }}";
        window.SITE_BASEURL = "{{ site.baseurl }}";
    </script>
</head>
<body>

{% include icons-sprite.html %}

{% unless page.sin_layout %}
<div class="topbar">
    <div class="topbar-izquierda">
        <a class="brand" href="{{ '/portal.html' | relative_url }}">
            <span class="sello"><svg class="icon icon-sm" style="color:#fff; vertical-align:-3px;"><use href="#icon-estudiantes"></use></svg></span>
            Sistema de Gestión Docente
        </a>
        {% if page.modulo_nombre %}<span class="modulo-actual-pill">{{ page.modulo_nombre }}</span>{% endif %}
    </div>
    <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">
        <svg class="icon" style="color:#fff;"><use href="#icon-menu"></use></svg>
    </button>
    {% include nav.html %}
    <div class="usuario-box">
        <span class="badge" id="anioEscolarBadge" style="display:none;" title="Año escolar activo"></span>
        <span id="nombreUsuario"></span>
        <span class="badge" id="rolUsuario"></span>
        <a href="{{ '/mi-cuenta.html' | relative_url }}" class="btn-mi-cuenta" title="Mi cuenta"><svg class="icon icon-sm"><use href="#icon-usuario"></use></svg></a>
        <button class="btn-salir" onclick="Auth.cerrarSesion()"><svg class="icon icon-sm"><use href="#icon-salir"></use></svg> Salir</button>
    </div>
</div>
{% endunless %}

<script src="{{ '/assets/js/api.js' | relative_url }}"></script>

{% unless page.sin_layout %}
<script>
    // Este bloque corre ANTES del contenido de la página (ver más abajo),
    // así los scripts propios de cada página (cursos.js, usuarios.js, etc.)
    // ya encuentran cargado api.js y la sesión ya verificada cuando se ejecutan.
    // Si no hay sesión válida, protegerPagina() ya redirige a index.html.
    window.__sesionValida = protegerPagina({ requiereAdmin: {{ page.requiere_admin | default: false }} });

    if (window.__sesionValida) {
        document.addEventListener('DOMContentLoaded', () => {
            const u = Auth.getUsuario();
            document.getElementById('nombreUsuario').textContent = u.nombre;
            const ETIQUETAS_ROL = { admin: 'Administrador', profesor: 'Profesor', orientador: 'Orientador', coordinador: 'Coordinador' };
            const rolEl = document.getElementById('rolUsuario');
            rolEl.textContent = ETIQUETAS_ROL[u.rol] || u.rol;
            rolEl.classList.add(u.rol);

            if (u.rol !== 'admin') {
                document.querySelectorAll('[data-solo-admin]').forEach(el => el.style.display = 'none');
            }
            // Visibilidad genérica por rol: data-roles="admin,profesor" oculta el
            // elemento para cualquier rol que no esté en esa lista.
            document.querySelectorAll('[data-roles]').forEach(el => {
                const permitidos = el.dataset.roles.split(',').map(r => r.trim());
                if (!permitidos.includes(u.rol)) el.style.display = 'none';
            });

            document.querySelectorAll('.topbar nav a').forEach(a => {
                if (a.getAttribute('href').endsWith(window.location.pathname.split('/').pop())) {
                    a.classList.add('activo');
                }
            });

            const toggle = document.getElementById('menuToggle');
            const nav = document.querySelector('.topbar nav');
            if (toggle) toggle.addEventListener('click', () => nav.classList.toggle('abierto'));

            // Año escolar activo, visible en todas las páginas
            apiFetch('anios_escolares.php?activo=1').then(anio => {
                if (!anio) return;
                const badge = document.getElementById('anioEscolarBadge');
                badge.innerHTML = '<svg class="icon icon-xs"><use href="#icon-anio-escolar"></use></svg> ' + anio.nombre;
                badge.style.display = 'inline-block';
            }).catch(() => { /* no bloquea el resto de la página */ });
        });
    }
</script>
{% endunless %}

<main class="contenido">
    {{ content }}
</main>

</body>
</html>
