    <path d="M640 255 L640 340" stroke="#245B91" stroke-width="12"/>
    <circle cx="640" cy="355" r="12" fill="#245B91" stroke="none"/>

    <!-- Central person -->
    <circle cx="500" cy="365" r="43" fill="url(#blueGrad)" stroke="none"/>
    <path d="M415 510 Q420 415 500 415 Q580 415 585 510 L500 590 Z" fill="url(#blueGrad)" stroke="none"/>

    <!-- Left person -->
    <circle cx="365" cy="400" r="30" fill="url(#blueGrad)" stroke="none"/>
