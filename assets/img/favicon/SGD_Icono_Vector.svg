    <!-- Right person -->
    <circle cx="635" cy="400" r="30" fill="url(#blueGrad)" stroke="none"/>
    <path d="M580 500 Q590 435 635 435 Q680 435 685 500 L635 525 Z" fill="url(#blueGrad)" stroke="none"/>

    <!-- Open book -->
    <path d="M180 535 Q335 540 500 655 Q390 585 275 575 L180 575 Z" fill="url(#blueGrad)" stroke="none"/>
    <path d="M820 535 Q665 540 500 655 Q610 585 725 575 L820 575 Z" fill="url(#blueGrad)" stroke="none"/>
    <path d="M500 655 Q390 565 210 555" stroke="#F6F6F0" stroke-width="14"/>
    <path d="M500 655 Q610 565 790 555" stroke="#F6F6F0" stroke-width="14"/>
    <path d="M175 575 L500 680 L825 575" stroke="#245B91" stroke-width="10"/>

    <!-- SGD wordmark -->
    
  </g>
