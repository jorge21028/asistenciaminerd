---
layout: default
titulo: Bloques de horario
requiere_admin: true
---
<div class="page-header">
    <div>
        <h1>Bloques de horario</h1>
        <p class="subtitulo">El campanario del centro: bloques de clase, receso y almuerzo. Es el mismo para todos los profesores.</p>
    </div>
</div>

<div class="card">
    <h3 id="tituloForm">Nuevo bloque</h3>
    <div id="alertaBloque"></div>
    <form id="formBloque">
        <input type="hidden" id="bloqueId">
        <div class="fila-form">
            <div class="campo" style="max-width:100px;">
                <label for="orden">Orden</label>
                <input type="number" id="orden" min="1" required>
            </div>
            <div class="campo">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" placeholder="Ej: Bloque 1, Recreo, Almuerzo" required>
            </div>
            <div class="campo">
                <label for="horaInicio">Hora inicio</label>
                <input type="time" id="horaInicio" required>
            </div>
            <div class="campo">
                <label for="horaFin">Hora fin</label>
                <input type="time" id="horaFin" required>
            </div>
            <div class="campo">
                <label for="tipo">Tipo</label>
                <select id="tipo">
                    <option value="clase">Clase</option>
                    <option value="receso">Receso</option>
                    <option value="almuerzo">Almuerzo</option>
                </select>
            </div>
            <button type="submit" class="btn">Guardar</button>
            <button type="button" class="btn secundario" id="btnCancelar" style="display:none;">Cancelar</button>
        </div>
    </form>
</div>

<div class="card">
    <div class="tabla-wrap">
        <table>
            <thead><tr><th class="num">Orden</th><th>Nombre</th><th>Inicio</th><th>Fin</th><th>Tipo</th><th>Acciones</th></tr></thead>
            <tbody id="tablaBloques"></tbody>
        </table>
    </div>
</div>

<script src="{{ '/assets/js/bloques.js' | relative_url }}"></script>
