---
layout: default
titulo: Cursos
requiere_admin: true
---
<div class="page-header">
    <div>
        <h1>Cursos</h1>
        <p class="subtitulo">Grados y secciones del centro educativo · <a href="{{ '/anios-escolares.html' | relative_url }}">Gestionar años escolares</a></p>
    </div>
</div>

<div class="card">
    <h3 id="tituloForm">Nuevo curso</h3>
    <div id="alertaCurso"></div>
    <form id="formCurso">
        <input type="hidden" id="cursoId">
        <div class="fila-form">
            <div class="campo">
                <label for="grado">Grado</label>
                <input type="text" id="grado" placeholder="Ej: 1ro" required>
            </div>
            <div class="campo">
                <label for="seccion">Sección</label>
                <input type="text" id="seccion" placeholder="Ej: A" required>
            </div>
            <div class="campo">
                <label for="anioEscolar">Año escolar</label>
                <select id="anioEscolar" required></select>
            </div>
            <div class="campo">
                <label for="profesorGuia">Profesor guía (opcional)</label>
                <select id="profesorGuia"><option value="">— Sin asignar —</option></select>
            </div>
            <button type="submit" class="btn">Guardar</button>
            <button type="button" class="btn secundario" id="btnCancelar" style="display:none;">Cancelar</button>
        </div>
    </form>
</div>

<div class="card">
    <div class="fila-form" style="margin-bottom:0;">
        <div class="campo" style="max-width:280px;">
            <label for="filtroAnio">Ver cursos del año</label>
            <select id="filtroAnio"><option value="">Todos los años</option></select>
        </div>
    </div>
</div>

<div class="card">
    <div class="tabla-wrap">
        <table>
            <thead>
                <tr><th>Curso</th><th>Año escolar</th><th>Profesor guía</th><th>Acciones</th></tr>
            </thead>
            <tbody id="tablaCursos"></tbody>
        </table>
    </div>
    <div id="estadoVacio" class="vacio-estado" style="display:none;">Aún no has creado ningún curso.</div>
</div>

<script src="{{ '/assets/js/cursos.js' | relative_url }}"></script>
