---
layout: default
titulo: Tomar asistencia
---
<div class="page-header">
    <div>
        <h1>Tomar asistencia</h1>
        <p class="subtitulo">Selecciona curso, asignatura y fecha para pasar lista</p>
    </div>
</div>

<div class="card">
    <div id="alertaAsistencia"></div>
    <div class="fila-form">
        <div class="campo" style="flex: 2;">
            <label for="cursoAsignatura">Curso y asignatura</label>
            <select id="cursoAsignatura"></select>
        </div>
        <div class="campo">
            <label for="fecha">Fecha</label>
            <input type="date" id="fecha">
        </div>
        <button class="btn secundario" id="btnCargar">Cargar lista</button>
    </div>
</div>

<div class="card" id="cardLista" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
        <h3 style="margin:0;">Lista de estudiantes</h3>
        <div class="fila-form" style="gap:8px;">
            <button class="btn secundario chico" onclick="marcarTodos('presente')">Marcar todos presentes</button>
        </div>
    </div>
    <div class="leyenda">
        <span><span class="sello-estado presente" style="width:20px;height:20px;font-size:0.65rem;">P</span> Presente</span>
        <span><span class="sello-estado ausente" style="width:20px;height:20px;font-size:0.65rem;">A</span> Ausente</span>
        <span><span class="sello-estado tardanza" style="width:20px;height:20px;font-size:0.65rem;">T</span> Tardanza</span>
        <span><span class="sello-estado excusa" style="width:20px;height:20px;font-size:0.65rem;">E</span> Excusa</span>
    </div>
    <div class="tabla-wrap">
        <table>
            <thead><tr><th>Estudiante</th><th>Matrícula</th><th>Estado</th><th>Observación</th></tr></thead>
            <tbody id="tablaLista"></tbody>
        </table>
    </div>
    <div style="margin-top:16px;">
        <button class="btn" id="btnGuardar">Guardar asistencia</button>
    </div>
</div>

<div id="estadoVacio" class="vacio-estado" style="display:none;">No tienes cursos/asignaturas asignados todavía. Contacta al administrador.</div>

<script src="{{ '/assets/js/asistencia.js' | relative_url }}"></script>
