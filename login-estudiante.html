---
layout: default
titulo: Espacio Académico — Iniciar sesión
sin_layout: true
---
<div class="login-shell">
    <div class="login-card">
        <div class="sello-login"><svg class="icon icon-lg"><use href="#icon-libro"></use></svg></div>
        <h1>Espacio Académico</h1>
        <p class="subtitulo">Inicia sesión con tu cuenta de estudiante</p>

        <div id="alertaLoginEA"></div>

        <form id="formLoginEA">
            <div class="campo">
                <label for="emailEA">Correo</label>
                <input type="email" id="emailEA" required autocomplete="username">
            </div>
            <div class="campo">
                <label for="passwordEA">Contraseña</label>
                <input type="password" id="passwordEA" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn" style="width:100%; justify-content:center;" id="btnLoginEA">Entrar</button>
        </form>

        <p class="subtitulo" style="margin-top:16px; font-size:0.85rem;">
            ¿Eres profesor o administrador? <a href="{{ '/index.html' | relative_url }}">Inicia sesión aquí</a>
        </p>
    </div>
</div>

<script src="{{ '/assets/js/api-estudiante.js' | relative_url }}"></script>
<script>
    if (AuthEA.estaAutenticado()) {
        window.location.href = rutaBase('espacio-academico.html');
    }

    document.getElementById('formLoginEA').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnLoginEA');
        btn.disabled = true;
        btn.textContent = 'Entrando…';

        try {
            const data = await apiFetchEA('auth_estudiante.php?action=login', {
                method: 'POST',
                body: {
                    email: document.getElementById('emailEA').value.trim(),
                    password: document.getElementById('passwordEA').value,
                },
            });
            AuthEA.guardarSesion(data.token, data.estudiante);
            window.location.href = rutaBase('espacio-academico.html');
        } catch (err) {
            mostrarAlerta('alertaLoginEA', err.message);
            btn.disabled = false;
            btn.textContent = 'Entrar';
        }
    });
</script>
