---
layout: default
titulo: Iniciar sesión
sin_layout: true
---
<div class="login-shell">
    <div class="login-card">
        <div class="sello-login">A</div>
        <h1>Sistema de Asistencia</h1>
        <p class="subtitulo">Inicia sesión para pasar asistencia y ver tus reportes</p>

        <div id="alertaLogin"></div>

        <form id="formLogin">
            <div class="campo">
                <label for="email">Correo</label>
                <input type="email" id="email" required autocomplete="username">
            </div>
            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn" style="width:100%; justify-content:center;" id="btnLogin">Entrar</button>
        </form>
    </div>
</div>

<script src="{{ '/assets/js/api.js' | relative_url }}"></script>
<script>
    // Si ya hay sesión activa, ir directo al dashboard
    if (Auth.estaAutenticado()) {
        window.location.href = rutaBase('portal.html');
    }

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnLogin');
        btn.disabled = true;
        btn.textContent = 'Entrando…';

        try {
            const data = await apiFetch('auth.php?action=login', {
                method: 'POST',
                body: {
                    email: document.getElementById('email').value.trim(),
                    password: document.getElementById('password').value,
                },
            });
            Auth.guardarSesion(data.token, data.usuario);
            window.location.href = rutaBase('portal.html');
        } catch (err) {
            mostrarAlerta('alertaLogin', err.message);
            btn.disabled = false;
            btn.textContent = 'Entrar';
        }
    });
</script>
