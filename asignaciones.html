---
layout: default
titulo: Asignaciones
requiere_admin: true
---
<div class="page-header">
    <div>
        <h1>Asignaciones</h1>
        <p class="subtitulo">Qué profesor imparte qué asignatura en qué curso</p>
    </div>
</div>

<div class="card">
    <h3>Nueva asignación</h3>
    <div id="alertaAsignacion"></div>
    <form id="formAsignacion">
        <div class="fila-form">
            <div class="campo">
                <label for="profesor">Profesor</label>
                <select id="profesor" required></select>
            </div>
            <div class="campo">
                <label for="curso">Curso</label>
                <select id="curso" required></select>
            </div>
            <div class="campo">
                <label for="asignatura">Asignatura</label>
                <select id="asignatura" required></select>
            </div>
            <button type="submit" class="btn">Asignar</button>
        </div>
    </form>
</div>

<div class="card">
    <div class="tabla-wrap">
        <table>
            <thead><tr><th>Profesor</th><th>Curso</th><th>Asignatura</th><th>Acciones</th></tr></thead>
            <tbody id="tablaAsignaciones"></tbody>
        </table>
    </div>
    <div id="estadoVacio" class="vacio-estado" style="display:none;">Aún no hay asignaciones creadas.</div>
</div>

<script src="{{ '/assets/js/asignaciones.js' | relative_url }}"></script>
